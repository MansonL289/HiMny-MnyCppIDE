<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  // 先按系统主题上色，避免脚本加载前出现白闪；设置页指定了主题时 editor.js 会再切一次
  document.documentElement.dataset.theme =
    window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
<style>
  /* 颜色统一走变量：编辑器主题切换时页面外壳（标签栏、终端）一起跟着变 */
  :root {
    color-scheme: light;
    --bg: #f3f3f3;
    --tabs-bg: #f3f3f3;
    --tab-active: #fff;
    --tab-text: #333;
    --border: #dcdcdc;
    --border-soft: #e5e5e5;
    --text: #333;
    --text-muted: #555;
    --hover: #e1e1e1;
    --editor-bg: #fff;
    --panel-bg: #fff;
    --term-bg: #fff;
    --term-text: #1e1e1e;
    --prompt: #0078d4;
    --notice-fg: #5d4300;
    --notice-bg: #fff4ce;
    --notice-border: #e5dfa5;
    --vh-comment: #6a737d;
    --vh-keyword: #af00db;
    --vh-string: #a31515;
    --vh-include: #0451a5;
    --vh-number: #098658;
    --vh-type: #267f99;
    --vh-operator: #0451a5;
    --vh-delimiter: #333;
    --vh-function: #795e26;
    --vh-variable: #001080;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1e2027;
    --tabs-bg: #1f1f1f;
    --tab-active: #252526;
    --tab-text: #ddd;
    --border: #333;
    --border-soft: #333;
    --text: #ddd;
    --text-muted: #aaa;
    --hover: #3a3a3a;
    --editor-bg: #1e2027;
    --panel-bg: #1e1e1e;
    --term-bg: #1e1e1e;
    --term-text: #d4d4d4;
    --prompt: #4ec9b0;
    --notice-fg: #f8e3a1;
    --notice-bg: #3b321c;
    --notice-border: #5c4d24;
    --vh-comment: #5c6370;
    --vh-keyword: #c678dd;
    --vh-string: #98c379;
    --vh-include: #61afef;
    --vh-number: #d19a66;
    --vh-type: #e5c07b;
    --vh-operator: #56b6c2;
    --vh-delimiter: #a6adba;
    --vh-function: #61afef;
    --vh-variable: #9cdcfe;
  }
  /* html 透明，body 自己画圆角：这样编辑器卡片的四角不会被 WebView2 的方形表面盖住 */
  html { background: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
  body {
    display: flex; flex-direction: column; background: var(--bg);
    /* 和 XAML 那边 Border 的 12px 圆角保持一致，避免圆角外露出一块方形底色 */
    border-radius: 12px 12px 0 12px; overflow: hidden;
    clip-path: inset(0 0 0 0 round 12px 12px 0 12px);
  }
  #tabs {
    display: flex; align-items: stretch; flex: 0 0 auto;
    height: 34px; overflow-x: auto; overflow-y: hidden;
    background: var(--tabs-bg); border-bottom: 1px solid var(--border);
    border-radius: 12px 12px 0 0;
  }
  #tabs::-webkit-scrollbar { height: 4px; }
  /* 标签栏末尾的新建按钮，滚动时固定在右侧 */
  .tab-add {
    position: sticky; right: 0; flex: 0 0 34px;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 15px; line-height: 1;
    color: var(--tab-text); background: var(--tabs-bg);
    border: none; border-left: 1px solid var(--border);
    cursor: pointer; user-select: none; padding: 0;
  }
  .tab-add:hover { background: var(--tab-active); }
  .tab {
    display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px;
    font-size: 12px; color: var(--tab-text); border-right: 1px solid var(--border);
    cursor: pointer; user-select: none; white-space: nowrap; max-width: 240px;
  }
  .tab.active { background: var(--tab-active); }
  .tab .name { overflow: hidden; text-overflow: ellipsis; }
  .tab .dot { color: #d13438; font-size: 10px; }
  .tab .close {
    width: 18px; height: 18px; line-height: 17px; text-align: center;
    border-radius: 3px; opacity: .55; font-size: 12px;
  }
  .tab .close:hover { background: var(--hover); opacity: 1; }
  #largeFileNotice {
    display: none; flex: 0 0 auto; padding: 7px 12px;
    color: var(--notice-fg); background: var(--notice-bg);
    border-bottom: 1px solid var(--notice-border);
    font-size: 12px; user-select: none;
  }
  #largeFileNotice.visible { display: block; }
  /* 编辑器区域铺满整个圆角卡片（圆角由 XAML 那边的 Border 做） */
  #editor {
    flex: 1 1 auto; min-height: 0;
    background: var(--editor-bg); overflow: hidden;
  }
  /* 面板折叠时编辑器是整个卡片的底边，圆角由 body 统一裁切 */

  /* 大文件 Alt+F 局部着色：只通过装饰器改颜色，不开启全文语言模式 */
  .mny-vh-comment { color: var(--vh-comment) !important; font-style: italic; }
  .mny-vh-keyword { color: var(--vh-keyword) !important; }
  .mny-vh-string { color: var(--vh-string) !important; }
  .mny-vh-include, .mny-vh-escape { color: var(--vh-include) !important; }
  .mny-vh-number { color: var(--vh-number) !important; }
  .mny-vh-type { color: var(--vh-type) !important; }
  .mny-vh-operator { color: var(--vh-operator) !important; }
  .mny-vh-delimiter { color: var(--vh-delimiter) !important; }

  /* 语义着色（函数、变量、std、库符号、自定义类型）同样只改颜色，不动排版 */
  .mny-sem-keyword { color: var(--vh-keyword) !important; }
  .mny-sem-type { color: var(--vh-type) !important; }
  .mny-sem-function { color: var(--vh-function) !important; }
  .mny-sem-variable { color: var(--vh-variable) !important; }

  /* 调试：行号左侧的红点断点 + 当前执行行高亮 */
  /* 注意：装饰元素由 Monaco 自己用 inline top 定位，这里不能再写 position/top/left */
  .mny-breakpoint {
    width: 10px;
    height: 10px;
    margin-left: 5px;
    margin-top: 4px;
    border-radius: 50%;
    background: #e51400;
    cursor: pointer;
  }
  .mny-debug-line { background: rgba(255, 196, 0, 0.20); }
  .mny-debug-line-glyph {
    width: 0;
    height: 0;
    margin-left: 6px;
    margin-top: 5px;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 8px solid #e5a000;
  }

  /* ---- 终端面板（仿 VS Code 底部面板） ---- */
  #panel {
    flex: 0 0 auto; height: 220px; display: flex; flex-direction: column;
    border-top: 1px solid var(--border); background: var(--panel-bg);
    border-radius: 0;
    overflow: hidden;
  }
  #panel.collapsed { display: none; }

  /* ---- 底部状态栏 ---- */
  #statusbar {
    flex: 0 0 auto; height: 24px; display: flex; align-items: center;
    justify-content: flex-end; gap: 10px; padding: 0 10px;
    background: var(--tabs-bg); border-top: 1px solid var(--border);
    border-bottom-left-radius: 12px;
    font-size: 11px; color: var(--text-muted); user-select: none;
  }
  #encodingSelect {
    font-family: inherit; font-size: 11px; color: var(--text-muted);
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    padding: 1px 4px; cursor: pointer; outline: none;
  }
  #encodingSelect:hover { border-color: var(--border); color: var(--text); }
  #encodingSelect option { background: var(--tabs-bg); color: var(--text); }
  .panel-header {
    display: flex; align-items: center; gap: 2px;
    height: 32px; padding: 0 8px 0 12px; flex: 0 0 auto;
    border-bottom: 1px solid var(--border-soft); user-select: none;
  }
  .panel-title {
    font-size: 11px; letter-spacing: .8px; text-transform: uppercase;
    color: var(--text-muted); margin-right: auto;
  }
  .panel-btn {
    width: 26px; height: 24px; border: none; border-radius: 4px;
    background: transparent; color: var(--text-muted); font-size: 13px; line-height: 1;
    cursor: pointer; font-family: inherit;
  }
  .panel-btn:hover { background: var(--hover); }
  .panel-main { flex: 1 1 auto; display: flex; min-height: 0; }
  .term-tabs {
    width: 140px; flex: 0 0 auto; overflow-y: auto;
    border-right: 1px solid var(--border-soft); padding: 4px;
  }
  .term-tab {
    display: flex; align-items: center; padding: 3px 6px;
    border-radius: 4px; font-size: 12px; color: var(--text);
    cursor: pointer; user-select: none;
  }
  .term-tab.active { background: var(--hover); }
  .term-tab .tname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .term-tab .tkill { width: 18px; text-align: center; border-radius: 3px; opacity: 0; }
  .term-tab:hover .tkill { opacity: .6; }
  .term-tab .tkill:hover { background: var(--border); opacity: 1; }
  .term-body { flex: 1 1 auto; min-width: 0; position: relative; }
  .term-view {
    position: absolute; inset: 0; display: none; flex-direction: column;
    background: var(--term-bg); color: var(--term-text);
  }
  .term-view.active { display: flex; }
  .term-output {
    flex: 1 1 auto; margin: 0; padding: 6px 10px; overflow-y: auto;
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-all; user-select: text; cursor: text;
  }
  .term-input-row { display: flex; align-items: center; gap: 6px; padding: 2px 10px 6px; }
  .term-input-row .prompt {
    color: var(--prompt); font-family: Consolas, monospace; font-size: 12px; flex: 0 0 auto;
  }
  .term-input {
    flex: 1 1 auto; border: none; outline: none; background: transparent; color: inherit;
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; padding: 0;
  }
</style>
</head>
<body>
  <div id="tabs"></div>
  <div id="largeFileNotice" role="status" title="按住 Alt+F 可临时高亮可见区域及上下 5 行">文件较大，已开启大文件模式，部分功能缺失。</div>
  <div id="editor"></div>
  <div id="panel" class="collapsed">
    <div class="panel-header">
      <span class="panel-title">终端</span>
      <button class="panel-btn" id="termNew" title="新建终端">＋</button>
      <button class="panel-btn" id="termHide" title="折叠面板">∨</button>
      <button class="panel-btn" id="termClose" title="关闭面板（终止全部终端）">×</button>
    </div>
    <div class="panel-main">
      <div class="term-tabs" id="termTabs"></div>
      <div class="term-body" id="termBody"></div>
    </div>
  </div>

  <!-- 状态栏：光标行列 + 保存编码 -->
  <div id="statusbar">
    <span id="cursorPos">行 1，列 1</span>
    <select id="encodingSelect">
      <option value="utf8">UTF-8</option>
      <option value="utf8bom">UTF-8 BOM</option>
      <option value="gbk">GBK</option>
    </select>
  </div>
  <script src="./vs/loader.js"></script>
  <script>
    // 动态加载并带时间戳，避免 WebView2 使用旧的缓存脚本
    var script = document.createElement('script');
    script.src = './editor.js?v=' + Date.now();
    document.body.appendChild(script);
  </script>
</body>
</html>
